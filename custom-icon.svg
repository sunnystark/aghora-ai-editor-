<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid black background -->
  <rect width="256" height="256" fill="#000" rx="48"/>

  <!-- Stylized 'A' (inspired by Starlink X, diagonal, modern, sharp) -->
  <g>
    <!-- Main diagonal stroke -->
    <rect x="120" y="48" width="16" height="160" rx="8" fill="white" transform="rotate(20 128 128)"/>
    <!-- Crossbar -->
    <rect x="88" y="140" width="80" height="14" rx="7" fill="white" transform="rotate(-10 128 147)"/>
    <!-- Right leg -->
    <rect x="120" y="48" width="16" height="160" rx="8" fill="white" transform="rotate(-20 128 128)"/>
  </g>
</svg>
